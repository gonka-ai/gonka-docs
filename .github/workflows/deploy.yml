name: Deploy
on:
  push:
    branches:
      - master
      - main
  # Per-epoch price refresh: poll often, but the `gate` job below only lets a
  # scheduled run through when a new epoch's Proof-of-Compute has finished.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
# Serialize deploys so a scheduled refresh and a push can't clobber gh-pages.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false
jobs:
  # Decide whether this run should build+publish. Push / manual runs always do.
  # Scheduled runs only proceed once per epoch, after PoC (phase == "Inference")
  # and once the chain epoch is newer than the epoch already published.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - id: decide
        name: Decide whether to deploy
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event ${{ github.event_name }}: deploying unconditionally."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(curl -sf --max-time 20 https://node3.gonka.ai/v1/epochs/latest) || {
            echo "epochs/latest unreachable; skipping this scheduled run."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"; exit 0; }
          E=$(printf '%s' "$latest" | jq -r '.latest_epoch.index // empty')
          phase=$(printf '%s' "$latest" | jq -r '.phase // empty')
          P=$(curl -sf --max-time 20 https://gonka.ai/docs/wallet/price-epoch.txt 2>/dev/null || echo 0)
          case "$P" in ''|*[!0-9]*) P=0 ;; esac
          case "$E" in ''|*[!0-9]*) E=0 ;; esac
          echo "chain epoch=$E phase=$phase, published epoch=$P"
          if [ "$phase" = "Inference" ] && [ "$E" -gt "$P" ]; then
            echo "New post-PoC epoch: deploying."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new post-PoC epoch: skipping."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: ./buildtools/mkdocs-setup.sh
      - name: Stage split build inputs
        run: ./buildtools/prepare-stages.sh
      # Inject the live per-epoch price table into the STAGED docs only (source
      # on main is untouched -> no commit litter). On a scheduled run a fetch
      # failure exits non-zero and aborts the deploy so the last-published table
      # stays live; on push/dispatch it degrades to a "temporarily unavailable"
      # note so routine doc deploys are never blocked.
      - name: Inject on-chain price table
        run: python3 ./buildtools/inject-pricing.py
      # IMPORTANT: build the landing first. mkdocs --clean (default) wipes its
      # entire site_dir; the home build's site_dir is _publish, so running it
      # after the docs build would delete _publish/docs. Running it first is
      # safe because the docs build lands in a subdirectory (_publish/docs)
      # and only cleans that subdirectory.
      - name: Build landing (served at /)
        run: mkdocs build -f mkdocs.home.yml
      - name: Build docs (served at /docs/)
        run: mkdocs build -f mkdocs.docs.yml
      - name: Generate legacy-URL redirect stubs
        run: python3 ./buildtools/generate-redirects.py
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_publish
          publish_branch: gh-pages
          cname: gonka.ai
          force_orphan: true
